name: IDrive Linux builds

on:
  push:
    branches: [idrive-cloud-drive]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idrive-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RCLONE_CONFIG: /dev/null
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test IDrive backend
        run: |
          go test -race ./backend/idrive/...
          go vet ./backend/idrive/...
      - name: Build and verify executable
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p package dist
          go build -trimpath -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=idrive-${GITHUB_SHA:0:12}" -o package/rclone-idrive .
          package/rclone-idrive version
          package/rclone-idrive help backends | grep -F 'idrive'
      - name: Package Linux installation
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          cp docs/content/idrive.md package/README.md
          printf 'commit=%s\nplatform=linux/%s\n' "$GITHUB_SHA" "$BUILD_ARCH" > package/BUILD-INFO
          (cd package && sha256sum rclone-idrive > SHA256SUMS)
          tar -czf "dist/rclone-idrive-linux-${BUILD_ARCH}.tar.gz" -C package .
      - name: Upload executable archive
        uses: actions/upload-artifact@v7
        with:
          name: rclone-idrive-linux-${{ matrix.arch }}
          path: dist/rclone-idrive-linux-${{ matrix.arch }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
